<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada | JSB Soluções Ambientais</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body style="background:#10271f;color:white;min-height:100vh;display:grid;place-items:center;">
  <main style="width:min(90%,720px);text-align:center;">
    <p style="text-transform:uppercase;letter-spacing:.14em;color:#cbd8b9;font-weight:700;">Erro 404</p>
    <h1 style="font-family:Montserrat,Arial,sans-serif;font-size:clamp(3rem,10vw,6rem);line-height:1;margin:.2em 0;">Página não encontrada.</h1>
    <p style="color:rgba(255,255,255,.7);">O endereço acessado não existe ou foi alterado.</p>
    <a class="btn btn-primary" href="./" style="margin-top:18px;">Voltar para o início</a>
  </main>
</body>
</html>
